<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>هوراز خالدیان | نقاش ماشین</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!----------------- main header ---------------->
    <header id="header">
      <!-- logo wrapper -->
      <div class="header__logo-box">
        <img src="./assets/images/logo.png" alt="logo" class="header__logo" />
        <h3 class="header__logo-title">
          اتو کورد
          <br />
          Auto kurd
        </h3>
      </div>

      <!-- navar list -->

      <nav>
        <ul class="header__navbar">
          <li><a href="#" class="header__nav-link header__active">خانه</a></li>
          <li><a href="#contact-us" class="header__nav-link">تماس با ما</a></li>
          <li><a href="#about-us" class="header__nav-link">درباره ما</a></li>
          <li><a href="#services" class="header__nav-link">خدمات</a></li>
        </ul>
      </nav>
    </header>
    <!--------------- Hero Section --------------->
    <div id="hero">
      <section class="hero__left-section">
        <h4 class="hero__title">
          نقاش <span class="hero__title--special">حرفه ای</span> خودرو
        </h4>
        <p class="hero__slogan">
          رنگی که تفاورت را <br />
          <span class="hero__slogan--special">نشان میدهد</span>
        </p>

        <p class="hero__describtion">
          ,با استفاده از بهترین متریال و تجهیزات دنیا <br />
          خودری شما را به حالت اولیه و حتی بهتر از ان برمیگردانیم
        </p>
      </section>
      <section class="hero__right-section">
        <img src="./assets/images/hero-car.jpg" alt="car" class="hero__img" />
      </section>
    </div>
  </body>
</html>
